<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <!-- Title/description below are replaced from content.js when the page loads -->
  <title>Portfolio</title>
  <meta name="description" content="Portfolio website.">

  <style>
    /* ============================================================
       PORTFOLIO — colors come from content.js
       (defaults below match content.js so nothing flashes)
       ============================================================ */
    :root {
      --bg: #1d2129;
      --surface: #212c3f;
      --border: #2a3140;
      --text: #ffffff;
      --muted: #9aa3b2;
      --accent: #00595c;
      --accent-contrast: #ffffff;
      --radius: 12px;
      --max-width: 1060px;
      /* derived tints — follow --accent automatically */
      --accent-2: color-mix(in srgb, var(--accent) 45%, #ffffff);
      --accent-soft: color-mix(in srgb, var(--accent) 13%, transparent);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font: 16px/1.7 ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent-2); }
    :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

    .wrap { width: 100%; max-width: var(--max-width); margin: 0 auto; padding: 0 1.5rem; }

    /* --- Header --- */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(12px) saturate(150%);
      -webkit-backdrop-filter: blur(12px) saturate(150%);
      border-bottom: 1px solid var(--border);
    }

    .bar { position: relative; display: flex; align-items: center; justify-content: space-between; min-height: 62px; gap: 1rem; }
    .logo { font-weight: 800; font-size: 1.05rem; color: var(--text); text-decoration: none; letter-spacing: -0.01em; }
    .nav-links { display: flex; gap: 1.4rem; list-style: none; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.92rem; font-weight: 500; transition: color .15s ease; }
    .nav-links a:hover { color: var(--text); }

    .nav-toggle {
      display: none;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      line-height: 1;
      padding: 0.4rem 0.6rem;
      cursor: pointer;
    }

    /* --- Sections / typography --- */
    section { padding: 3.5rem 0; scroll-margin-top: 78px; }
    h1 { font-size: clamp(2.4rem, 6vw, 3.6rem); line-height: 1.08; letter-spacing: -0.02em; }
    h1 .accent { color: var(--accent-2); }
    h2 {
      font-size: clamp(1.45rem, 3.2vw, 1.85rem);
      letter-spacing: -0.01em;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }
    h2::before { content: ""; width: 26px; height: 3px; border-radius: 2px; background: var(--accent-2); flex: none; }

    .eyebrow { color: var(--accent-2); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
    .subtitle { color: var(--text); font-size: clamp(1.15rem, 2.6vw, 1.45rem); font-weight: 500; margin-top: 0.5rem; }
    .intro { color: var(--muted); max-width: 62ch; margin-top: 0.75rem; }
    .prose { color: var(--muted); max-width: 68ch; }
    .prose p + p { margin-top: 0.9rem; }

    /* --- Hero --- */
    .hero { padding: 4rem 0; }
    .hero-inner { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 2.5rem; align-items: center; }
    .hero h1 { margin-top: 0.5rem; }
    .hero .intro { margin-top: 1rem; }

    /* --- Buttons --- */
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.5rem; }
    .actions.center { justify-content: center; }

    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.7rem 1.25rem;
      border-radius: 8px;
      border: 1px solid transparent;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: transform .16s ease, background .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn.primary { background: var(--accent); color: var(--accent-contrast); box-shadow: 0 8px 20px -10px var(--accent); }
    .btn.primary:hover { background: color-mix(in srgb, var(--accent) 84%, #000); }
    .btn.outline { border-color: var(--border); color: var(--text); }
    .btn.outline:hover { border-color: var(--accent-2); color: var(--accent-2); }

    /* --- Fact card (hero) --- */
    .fact-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.4rem;
    }
    .fact-card-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-2); margin-bottom: 0.9rem; }
    .fact-list { list-style: none; display: grid; gap: 0.85rem; }
    .fact-list li { display: flex; flex-direction: column; gap: 0.1rem; }
    .fact-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .fact-value { font-size: 0.95rem; font-weight: 600; color: var(--text); }
    .fact-value a { color: var(--accent-2); text-decoration: none; }
    .fact-value a:hover { text-decoration: underline; }

    /* --- Skills (grouped rows) --- */
    .skill-list { display: grid; gap: 1rem; margin-top: 1.5rem; }
    .skill-row { display: flex; align-items: baseline; gap: 1rem; }
    .skill-row h3 { flex: none; width: 180px; font-size: 0.9rem; font-weight: 700; color: var(--text); }
    .skill-row .pills { margin-top: 0; flex: 1; }

    .pills { display: flex; flex-wrap: wrap; gap: 0.4rem; list-style: none; margin-top: 0.6rem; }
    .pills li {
      background: var(--accent-soft);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.78rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }

    /* --- Projects --- */
    .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.4rem;
      position: relative;
      overflow: hidden;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .project-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent-2); opacity: 0; transition: opacity .18s ease; }
    .project-card:hover { transform: translateY(-3px); border-color: var(--accent-2); box-shadow: 0 16px 34px -20px rgba(0, 0, 0, 0.65); }
    .project-card:hover::before { opacity: 1; }
    .project-card h3 { font-size: 1.15rem; margin-bottom: 0.5rem; }
    .project-card p {
      color: var(--muted);
      font-size: 0.92rem;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .links { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 0.9rem; }
    .links a { font-size: 0.88rem; font-weight: 600; color: var(--accent-2); text-decoration: none; }
    .links a:hover { text-decoration: underline; }

    /* --- Contact --- */
    .contact {
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .contact h2 { justify-content: center; }
    .contact h2::before { display: none; }
    .contact .intro { margin-left: auto; margin-right: auto; }

    /* --- Footer --- */
    .site-footer { border-top: 1px solid var(--border); padding: 1.5rem 0; font-size: 0.9rem; color: var(--muted); }
    .footer-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; }
    .site-footer a { color: var(--muted); text-decoration: none; }
    .site-footer a:hover { color: var(--text); }

    .noscript { max-width: 560px; margin: 1.5rem auto; padding: 1rem; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }

    /* --- Responsive --- */
    @media (max-width: 760px) {
      .hero-inner { grid-template-columns: 1fr; gap: 1.5rem; }
      .hero { padding: 2.5rem 0; }
    }

    @media (max-width: 640px) {
      .nav-toggle { display: block; }
      .nav-links {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        flex-direction: column;
        gap: 0;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 0.4rem 0;
      }
      .nav-links.open { display: flex; }
      .nav-links a { display: block; padding: 0.75rem 1.5rem; }
      .skill-row { flex-direction: column; gap: 0.35rem; }
      .skill-row h3 { width: auto; }
      section { padding: 2.5rem 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .btn, .card, .project-card { transition: none; }
    }
  </style>
</head>
<body>
  <!-- ============================================================
       PAGE SKELETON — content is injected from content.js.
       You normally don't edit this file; edit content.js instead.
       ============================================================ -->
  <header class="site-header">
    <div class="wrap bar">
      <a class="logo" href="#home" id="logo"></a>
      <button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle navigation menu" aria-expanded="false">&#9776;</button>
      <ul class="nav-links" id="navLinks"></ul>
    </div>
  </header>

  <main>
    <section class="hero" id="home">
      <div class="wrap hero-inner">
        <div class="hero-copy">
          <p class="eyebrow" id="heroEyebrow"></p>
          <h1 id="heroName"></h1>
          <p class="subtitle" id="heroSubtitle"></p>
          <p class="intro" id="heroIntro"></p>
          <div class="actions" id="heroActions"></div>
        </div>
        <aside class="fact-card" id="heroFacts" aria-label="Key facts"></aside>
      </div>
    </section>

    <section id="projects">
      <div class="wrap">
        <h2 id="projectsTitle">Selected work</h2>
        <p class="intro" id="projectsIntro"></p>
        <div class="projects-grid" id="projectsGrid"></div>
      </div>
    </section>

    <section id="skills">
      <div class="wrap">
        <h2 id="skillsTitle">Tools I work with</h2>
        <p class="intro" id="skillsIntro"></p>
        <div class="skill-list" id="skillsList"></div>
      </div>
    </section>

    <section class="contact" id="contact">
      <div class="wrap">
        <h2 id="contactTitle">Get in touch</h2>
        <p class="intro" id="contactText"></p>
        <div class="actions center" id="contactActions"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>&copy; <span id="year">2026</span> <span id="footerText"></span></span>
      <a href="#home" id="footerTop">Back to top</a>
    </div>
  </footer>

  <noscript>
    <p class="noscript">This page needs JavaScript to display its content. Please enable JavaScript.</p>
  </noscript>

  <!-- ============================================================
       RENDER — fills the page from content.js.
       You normally don't edit this file; edit content.js instead.
       ============================================================ -->
  <script src="content.js"></script>
  <script>
    (function () {
      "use strict";

      var data = window.PORTFOLIO;
      if (!data) { return; }

      var $ = function (id) { return document.getElementById(id); };
      var esc = function (value) {
        return String(value).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      };
      var isExternal = function (url) { return /^https?:\/\//i.test(url); };
      var button = function (b) {
        return '<a class="btn ' + esc(b.style || "outline") + '" href="' + esc(b.href) + '"' +
          (isExternal(b.href) ? ' target="_blank" rel="noopener"' : "") + ">" + esc(b.label) + "</a>";
      };
      var buttons = function (list) { return (list || []).map(button).join(""); };
      var pills = function (items) {
        return '<ul class="pills">' + (items || []).map(function (t) {
          return "<li>" + esc(t) + "</li>";
        }).join("") + "</ul>";
      };

      /* Theme colors from content.js */
      Object.keys(data.theme || {}).forEach(function (key) {
        document.documentElement.style.setProperty(key, data.theme[key]);
      });

      /* Browser tab + SEO */
      document.title = data.site.title;
      var meta = document.querySelector('meta[name="description"]');
      if (meta) { meta.setAttribute("content", data.site.description); }

      /* Header / navigation */
      $("logo").innerHTML = esc(data.site.logo);
      $("navLinks").innerHTML = (data.nav || []).map(function (item) {
        return '<li><a href="' + esc(item.href) + '">' + esc(item.label) + "</a></li>";
      }).join("");

      /* Hero */
      $("heroEyebrow").textContent = data.hero.eyebrow;
      $("heroName").innerHTML = esc(data.hero.name) +
        '<span class="accent">' + esc(data.hero.accent || "") + "</span>";
      $("heroSubtitle").textContent = data.hero.subtitle;
      $("heroIntro").textContent = data.hero.intro;
      $("heroActions").innerHTML = buttons(data.hero.buttons);

      /* Hero quick-facts card (Location / Focus / Availability / Email) */
      $("heroFacts").innerHTML =
        '<p class="fact-card-title">At a glance</p><ul class="fact-list">' +
        (data.about.facts || []).map(function (f) {
          var value = f.href
            ? '<a href="' + esc(f.href) + '">' + esc(f.value) + "</a>"
            : esc(f.value);
          return '<li><span class="fact-label">' + esc(f.label) + '</span>' +
            '<span class="fact-value">' + value + "</span></li>";
        }).join("") + "</ul>";

      /* Skills */
      $("skillsTitle").textContent = data.skills.title;
      $("skillsIntro").textContent = data.skills.intro;
      $("skillsList").innerHTML = (data.skills.groups || []).map(function (g) {
        return '<div class="skill-row"><h3>' + esc(g.title) + "</h3>" + pills(g.items) + "</div>";
      }).join("");

      /* Projects */
      $("projectsTitle").textContent = data.projects.title;
      $("projectsIntro").textContent = data.projects.intro;
      $("projectsGrid").innerHTML = (data.projects.items || []).map(function (p) {
        var links = (p.links || []).map(function (l) {
          return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' +
            esc(l.label) + " &#8594;</a>";
        }).join("");
        return '<article class="project-card"><h3>' + esc(p.title) + "</h3><p>" + esc(p.description) +
          "</p>" + pills(p.tags) + '<div class="links">' + links + "</div></article>";
      }).join("");

      /* Contact + footer */
      $("contactTitle").textContent = data.contact.title;
      $("contactText").textContent = data.contact.text;
      $("contactActions").innerHTML = buttons(data.contact.buttons);
      $("footerText").textContent = data.footer.text;
      $("footerTop").textContent = data.footer.backToTop;
      $("year").textContent = new Date().getFullYear();

      /* Mobile menu */
      $("navToggle").addEventListener("click", function () {
        var open = $("navLinks").classList.toggle("open");
        $("navToggle").setAttribute("aria-expanded", String(open));
      });
      $("navLinks").addEventListener("click", function (event) {
        if (event.target.tagName === "A") {
          $("navLinks").classList.remove("open");
          $("navToggle").setAttribute("aria-expanded", "false");
        }
      });
    })();
  </script>




</body>
</html>
